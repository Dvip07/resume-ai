; Supervisor entrypoint for the `queue-worker` compose service.
;
; Same program as backend/deploy/supervisor/resume-ai-worker.conf — read that
; file for why each queue:work flag has the value it does. The only differences
; are container-shaped: supervisord runs in the foreground so it can be PID 1,
; and worker output goes to stdout/stderr so `docker compose logs queue-worker`
; shows it instead of it disappearing into storage/logs.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:queue-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html
command=php /var/www/html/artisan queue:work --queue=default --tries=3 --timeout=600 --max-time=3600 --max-jobs=200 --sleep=3 --rest=1
numprocs=2
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
; Above --timeout=600, so a worker is never SIGKILLed mid-apply.
stopwaitsecs=630
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
