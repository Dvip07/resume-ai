; Supervisor program for the resume-ai Laravel queue workers (Requirement 11.4).
;
; Install on a production host:
;   sudo cp backend/deploy/supervisor/resume-ai-worker.conf \
;           /etc/supervisor/conf.d/resume-ai-worker.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status resume-ai-worker:*
;
; Paths below assume the app is deployed at /var/www/html (the path the
; Docker image uses). Change `directory`, `command` and the log paths together
; if yours differs. `user` must be the account that owns storage/ and the
; LaTeX cache, or compiles and log writes fail.
;
; Supervisor is the right tool here rather than Laravel Horizon: the queue
; driver is `database` (config/queue.php, and the design's stack diagram), and
; Horizon only supports Redis. See docs/deployment/queue-workers.md for the
; full reasoning and the Redis migration path.

[program:resume-ai-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html

; --queue=default: every pipeline job is dispatched to the default queue today
;   (nothing calls onQueue), so a single pool covers discovery, enrichment,
;   scoring, tailoring and apply runs.
; --tries=3: fallback only. Each job class declares its own $tries/$backoff
;   (e.g. SubmitApplication = 2, TailorResume = 3) and those win.
; --timeout=600: has to clear the longest single job. An apply run allows the
;   automation worker 180s (services.automation_worker.apply_timeout) and a
;   tailoring run can spend 120s per model call (openrouter.timeout) plus a
;   120s LaTeX compile (LATEX_TIMEOUT), each over several attempts. 10 minutes
;   covers the worst realistic run while still killing a genuinely hung one.
;   Keep queue.connections.database.retry_after ABOVE this value, or the queue
;   will hand a still-running job to a second worker.
; --max-time=3600: recycle each process hourly. Cheap protection against
;   leaked memory and stale container/config state in long-lived PHP processes.
; --max-jobs=200: second recycle trigger for a busy worker.
; --sleep=3: poll interval when the queue is empty.
; --rest=1: brief pause between jobs so a burst does not starve the DB.
command=php /var/www/html/artisan queue:work --queue=default --tries=3 --timeout=600 --max-time=3600 --max-jobs=200 --sleep=3 --rest=1

; Two processes: the pipeline is IO-bound (LLM and automation-worker HTTP
; calls), so concurrency helps, but each tailoring run also spawns a LaTeX
; compile. Raise with the host's CPU and memory, and watch the automation
; worker's own AUTOMATION_WORKER_MAX_CONCURRENCY (default 2) before going far
; past it — past that it answers 503 and applies just retry.
numprocs=2

user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=3

; SIGTERM is what `queue:restart`/`supervisorctl stop` sends; queue:work
; finishes the job in hand before exiting. stopwaitsecs must exceed --timeout
; (600) or Supervisor SIGKILLs a worker mid-apply, leaving a listing stuck
; mid-pipeline and an unreserved job behind.
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=630

redirect_stderr=false
stdout_logfile=/var/www/html/storage/logs/queue-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/www/html/storage/logs/queue-worker.error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5

; A queue worker does not inherit your shell's PATH. `latex:check` passing in a
; terminal says nothing about what this process can find, so make the TeX
; engine's directory explicit here (or set LATEX_BINARY to an absolute path).
environment=PATH="/usr/local/bin:/usr/bin:/bin"
